<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>confirm </title>
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="../JS/script.js" defer></script>
</head>
<body>
    <main class="confirm-page">
        <header class="confirm-header">
            <a href="search.html" class="arrow1">←</a>
            <img class="bell" src="../assets/bell.png">
        </header>

    
<section class="confirm-sheet">

    <div class="sheet-handle"></div>

    <div class="trip-heading">
        <h1>8:00 <span class="trip-arrow">→</span> 8:35 AM</h1>
        <strong class="trip-total">$12</strong>
    </div>

    <p class="trip-details">
        Sat, Oct 24 · Steven
        <span class="verified">✓</span>
        · White Honda Civic
    </p>

    <section class="card1">
      <div class="row">
        <span class="start"></span>
        <div class="text">
          <h2>Lakeside Apartment</h2>
          <p>144 Front St, Oakville</p>
        </div>
      </div>

      <div class="row">
        <span class="end"></span>
        <div class="text">
          <h2>Sheridan College</h2>
          <p>Trafalgar Rd campus</p>
        </div>
      </div>
    </section>

    <div class="seats-row">
        <div class="seats-text">
            <h2>Seats</h2>
            <p>2 left on this ride</p>
        </div>

        <div class="seat-counter">
            <span class="seat-circle">-</span>
            <span class="seat-number">1</span>
            <span class="seat-circle">+</span>
</div>
    </div>

    <div class="payment-row">
        <span class="payment-card">Visa •••• 4417</span>
        <span class="payment-change">Change</span>
        <span class="cancel-pill">
            Free cancellation up to 2h before
        </span>
    </div>

    <button class="confirm-button" id="confirm-trip">Confirm · $12</button>

</section>


    <nav class="floating-nav">
    <img src="../assets/menu.png">

    <a class="home-link" href="index.html"></a>

    <a class="post-link" href="post.html"></a>
</nav>

    
</body>
</html>
    
</body>
</html>
