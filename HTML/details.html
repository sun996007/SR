<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post rides </title>
    <link rel="stylesheet" href="../CSS/details.css">
    <script src="../JS/script.js" defer></script>
     
</head>
<body>
    <main class="search-page">
        <header class="search-header">
            <a href="confirm.html" class="arrow1">←</a>
            <img class="bell" src="../assets/bell.png">
        </header>
    

    <div class="booked">
    <span class="check">✓</span>
    <span>Booked</span>
</div>


<h1 class="booking-time">8:00 AM</h1>

<div class="booking-date">
    <img class="calendar-icon-img" src="../assets/cad1.png">
    <span>Saturday, Oct 24 · in 2 days</span>
</div>


<section class="route-card">

    <div class="route-line"></div>

    <div class="route-point">
        <span class="route-time">8:00</span>
        <span class="start"></span>

        <div class="location-info">
            <h2>Lakeside Apartment</h2>
            <span class="arrival-note">Arrive 5 min early</span>
        </div>
    </div>

    <div class="route-point destination-point">
        <span class="route-time">8:35</span>
        <span class="end"></span>

        <div class="location-info">
            <h2>Sheridan College</h2>
        </div>
    </div>

    <span class="route-action">Route →</span>

</section>

<section class="driver-card">

    <img class="driver-photo"
         src="../assets/ui2.png">

    <div class="driver-info">
        <div class="driver-name">
            Steven <span class="verified">✓</span>
        </div>
        <p>White Honda Civic</p>
    </div>

    <span class="license-plate">BXKT 482</span>

    <span class="message-circle">
        <span class="chat-symbol">•••</span>
    </span>

</section>


<div class="booking-bottom">

    <button class="calendar-action" type="button">
    <img class="calendar-icon-img" src="../assets/cad1.png">
    <span>Add to calendar</span>
</button>

    <span class="cancel-booking" >
        Cancel booking
    </span>

</div>



    

    <nav class="floating-nav">
    <img src="../assets/menu.png">

    <a class="home-link" href="index.html"></a>
    <a class="find-link" href="search.html"></a>
    <a class="post-link" href="post.html"></a>
</nav>
</body>
</html>
